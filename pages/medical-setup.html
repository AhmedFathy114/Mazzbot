<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Onboarding · Medical Profile & Caregiver</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    /* =========================== COLORS =========================== */
    --primary: #6366f1;
    --primary-light: #eef2ff;
    --primary-dark: #4f46e5;

    --secondary: #8b5cf6;

    --success: #22c55e;
    --warning: #f59e0b;
    --danger: #ef4444;
    --info: #3b82f6;

    --background: #f8fafc;
    --surface: #ffffff;

    --sidebar-bg: #ffffff;
    --navbar-bg: #ffffff;

    --text-primary: #1e293b;
    --text-secondary: #64748b;
    --text-muted: #94a3b8;

    --border: #e2e8f0;

    /* =========================== TYPOGRAPHY =========================== */
    --font-family: "Poppins", sans-serif;

    --fs-xs: 12px;
    --fs-sm: 14px;
    --fs-md: 16px;
    --fs-lg: 18px;
    --fs-xl: 22px;
    --fs-2xl: 28px;
    --fs-3xl: 36px;

    --fw-regular: 400;
    --fw-medium: 500;
    --fw-semibold: 600;
    --fw-bold: 700;

    /* =========================== SPACING =========================== */
    --space-xs: 4px;
    --space-sm: 8px;
    --space-md: 16px;
    --space-lg: 24px;
    --space-xl: 32px;
    --space-2xl: 48px;

    /* =========================== BORDER RADIUS =========================== */
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 18px;
    --radius-xl: 24px;
    --radius-round: 999px;

    /* =========================== SHADOWS =========================== */
    --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.05);
    --shadow-md: 0 8px 20px rgba(0, 0, 0, 0.08);
    --shadow-lg: 0 15px 35px rgba(0, 0, 0, 0.12);

    /* =========================== TRANSITIONS =========================== */
    --transition: .3s cubic-bezier(.4,0,.2,1);

    /* =========================== LAYOUT =========================== */
    --sidebar-width: 260px;
    --navbar-height: 75px;

    --container-width: 1200px;

    /* extra tokens for this flow */
    --danger-light: #fef2f2;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: var(--font-family);
    background: var(--background);
    color: var(--text-primary);
    -webkit-font-smoothing: antialiased;
  }

  .page-wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: var(--space-2xl) var(--space-md) var(--space-2xl);
  }

  /* ============ STEPPER ============ */
  .stepper {
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: var(--space-2xl);
    gap: 0;
  }

  .step {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: var(--space-sm);
    flex-shrink: 0;
  }

  .step-circle {
    width: 48px;
    height: 48px;
    border-radius: var(--radius-round);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: var(--fw-bold);
    font-size: var(--fs-md);
    background: #e2e2f5;
    color: var(--text-muted);
    transition: background var(--transition), color var(--transition);
  }

  .step.done .step-circle,
  .step.active .step-circle {
    background: var(--primary);
    color: #fff;
  }

  .step-label {
    font-size: var(--fs-sm);
    font-weight: var(--fw-semibold);
    color: var(--text-muted);
  }

  .step.done .step-label,
  .step.active .step-label {
    color: var(--primary);
  }

  .step-line {
    height: 3px;
    width: clamp(50px, 12vw, 130px);
    background: var(--border);
    margin: 0 var(--space-xs);
    margin-bottom: 26px;
    border-radius: var(--radius-round);
    overflow: hidden;
    position: relative;
  }

  .step-line.filled::before {
    content: "";
    position: absolute;
    inset: 0;
    background: var(--primary);
  }

  /* ============ HEADER ============ */
  .form-header {
    text-align: center;
    margin-bottom: var(--space-2xl);
  }

  .form-header h1 {
    font-size: var(--fs-2xl);
    font-weight: var(--fw-bold);
    margin: 0 0 var(--space-xs);
  }

  .form-header p {
    font-size: var(--fs-md);
    color: var(--text-secondary);
    margin: 0;
  }

  /* ============ FORM ELEMENTS ============ */
  .field-label {
    display: block;
    font-size: var(--fs-sm);
    font-weight: var(--fw-semibold);
    color: var(--text-primary);
    margin-bottom: var(--space-sm);
  }

  .input,
  select.input {
    width: 100%;
    padding: 14px var(--space-md);
    border-radius: var(--radius-md);
    border: 1.5px solid var(--border);
    background: var(--primary-light);
    font-family: var(--font-family);
    font-size: var(--fs-md);
    color: var(--text-primary);
    outline: none;
    transition: border-color var(--transition), box-shadow var(--transition);
    appearance: none;
  }

  .input::placeholder { color: var(--text-muted); }

  .input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 4px rgba(99,102,241,.12);
    background: var(--surface);
  }

  .select-wrap { position: relative; }
  .select-wrap::after {
    content: "";
    position: absolute;
    right: var(--space-md);
    top: 50%;
    width: 10px;
    height: 10px;
    border-right: 2px solid var(--text-secondary);
    border-bottom: 2px solid var(--text-secondary);
    transform: translateY(-70%) rotate(45deg);
    pointer-events: none;
  }

  .input-icon-wrap {
    position: relative;
    display: flex;
    align-items: center;
  }

  .input-icon-wrap .icon {
    position: absolute;
    left: var(--space-md);
    width: 18px;
    height: 18px;
    color: var(--text-muted);
    display: flex;
  }

  .input-icon-wrap .input {
    padding-left: 42px;
  }

  .field-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: var(--space-md);
    margin-bottom: var(--space-lg);
  }

  .field { display: flex; flex-direction: column; }

  /* ============ BLOOD TYPE PILLS ============ */
  .pill-group {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: var(--space-sm);
    margin-bottom: var(--space-xl);
  }

  .pill {
    padding: 12px 4px;
    text-align: center;
    border-radius: var(--radius-md);
    border: 1.5px solid var(--border);
    background: var(--surface);
    font-weight: var(--fw-bold);
    font-size: var(--fs-md);
    color: var(--text-secondary);
    cursor: pointer;
    transition: all var(--transition);
    user-select: none;
  }

  .pill:hover { border-color: var(--primary); }

  .pill.selected {
    border-color: var(--primary);
    background: var(--primary-light);
    color: var(--primary);
  }

  /* ============ SECTION HEADINGS ============ */
  .section-title {
    display: flex;
    align-items: center;
    gap: var(--space-sm);
    font-size: var(--fs-lg);
    font-weight: var(--fw-bold);
    margin: 0 0 var(--space-md);
  }

  .section-title .icon-badge {
    width: 22px;
    height: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--primary);
  }

  .section-title.warning .icon-badge { color: var(--warning); }

  .two-col {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: var(--space-xl);
    margin-bottom: var(--space-xl);
  }

  /* ============ CHECKBOX LIST ============ */
  .check-list {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: var(--space-sm);
  }

  .check-item {
    display: flex;
    align-items: center;
    gap: var(--space-sm);
    padding: 14px var(--space-md);
    border-radius: var(--radius-md);
    border: 1.5px solid var(--border);
    background: var(--surface);
    font-size: var(--fs-md);
    color: var(--text-primary);
    cursor: pointer;
    transition: all var(--transition);
  }

  .check-item:has(input:checked) {
    border-color: var(--primary);
    background: var(--primary-light);
  }

  .check-item input {
    width: 18px;
    height: 18px;
    accent-color: var(--primary);
    border-radius: 4px;
    cursor: pointer;
  }

  textarea.input {
    resize: vertical;
    min-height: 140px;
    line-height: 1.5;
  }

  /* ============ EMERGENCY CONTACT CARD ============ */
  .alert-card {
    display: flex;
    gap: var(--space-md);
    background: var(--danger-light);
    border: 1px solid #fecaca;
    border-radius: var(--radius-lg);
    padding: var(--space-lg);
    margin-bottom: var(--space-xl);
  }

  .alert-card .icon {
    width: 42px;
    height: 42px;
    flex-shrink: 0;
    border-radius: var(--radius-md);
    background: #fde2e2;
    color: var(--danger);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .alert-card h3 {
    margin: 0 0 4px;
    font-size: var(--fs-lg);
    color: #b91c1c;
    font-weight: var(--fw-bold);
  }

  .alert-card p {
    margin: 0;
    font-size: var(--fs-sm);
    color: #b13333;
    line-height: 1.5;
  }

  .caregiver-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: var(--space-md);
    margin-bottom: var(--space-xl);
  }

  /* ============ BUTTONS ============ */
  .actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: var(--space-xl);
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: var(--space-sm);
    padding: 15px var(--space-xl);
    border-radius: var(--radius-round);
    font-family: var(--font-family);
    font-size: var(--fs-md);
    font-weight: var(--fw-semibold);
    border: none;
    cursor: pointer;
    transition: transform var(--transition), box-shadow var(--transition), background var(--transition);
  }

  .btn:active { transform: scale(0.97); }

  .btn-back {
    background: var(--primary-light);
    color: var(--primary);
  }

  .btn-back:hover { background: #e0e3fc; }

  .btn-next {
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: #fff;
    box-shadow: var(--shadow-md);
  }

  .btn-next:hover { box-shadow: var(--shadow-lg); }

  .btn-finish {
    background: linear-gradient(135deg, #d97706, #b45309);
    color: #fff;
    box-shadow: var(--shadow-md);
  }

  .btn-finish:hover { box-shadow: var(--shadow-lg); }

  .btn svg { width: 18px; height: 18px; }

  .btn:disabled { opacity: .65; cursor: not-allowed; }

  .form-error {
    color: var(--danger);
    font-size: var(--fs-sm);
    font-weight: var(--fw-medium);
    margin: var(--space-md) 0 0;
    min-height: 18px;
  }

  /* ============ PAGE SWITCH (demo only) ============ */
  .page { display: none; }
  .page.active { display: block; animation: fadeIn .35s ease; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ============ RESPONSIVE ============ */
  @media (max-width: 640px) {
    .field-row { grid-template-columns: 1fr 1fr; }
    .two-col { grid-template-columns: 1fr; gap: var(--space-lg); }
    .caregiver-grid { grid-template-columns: 1fr; }
    .pill-group { grid-template-columns: repeat(3, 1fr); }
    .check-list { grid-template-columns: 1fr; }
    .step-label { font-size: 11px; }
    .step-circle { width: 38px; height: 38px; font-size: var(--fs-sm); }
    .step-line { width: clamp(24px, 8vw, 60px); margin-bottom: 22px; }
    .form-header h1 { font-size: var(--fs-xl); }
    .actions { flex-direction: row; }
    .btn { padding: 13px var(--space-lg); font-size: var(--fs-sm); flex: 1; justify-content: center; }
    .alert-card { flex-direction: column; }
  }

  @media (max-width: 400px) {
    .field-row { grid-template-columns: 1fr 1fr; gap: var(--space-sm); }
    .pill-group { grid-template-columns: repeat(3, 1fr); }
  }
</style>
</head>
<body>

<div class="page-wrap">

  <!-- ============ SHARED STEPPER ============ -->
  <div class="stepper" id="stepper"></div>

  <!-- ============ PAGE 2: MEDICAL PROFILE ============ -->
  <section class="page active" id="page-medical">
    <div class="form-header">
      <h1>Medical Profile</h1>
      <p>Help us personalize your health journey</p>
    </div>

    <form onsubmit="return false;">
      <div class="field-row">
        <div class="field">
          <label class="field-label" for="age">Age</label>
          <input class="input" type="number" id="age" value="25">
        </div>
        <div class="field">
          <label class="field-label" for="gender">Gender</label>
          <div class="select-wrap">
            <select class="input" id="gender">
              <option>Female</option>
              <option>Male</option>
              <option>Other</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label class="field-label" for="height">Height (cm)</label>
          <input class="input" type="number" id="height" value="165">
        </div>
        <div class="field">
          <label class="field-label" for="weight">Weight (kg)</label>
          <input class="input" type="number" id="weight" value="60">
        </div>
      </div>

      <div class="field" style="margin-bottom: var(--space-xl);">
        <label class="field-label">Blood Type</label>
        <div class="pill-group" id="bloodTypeGroup">
          <div class="pill selected" data-value="A+">A+</div>
          <div class="pill" data-value="A-">A-</div>
          <div class="pill" data-value="B+">B+</div>
          <div class="pill" data-value="B-">B-</div>
          <div class="pill" data-value="O+">O+</div>
          <div class="pill" data-value="AB+">AB+</div>
        </div>
      </div>

      <div class="two-col">
        <div>
          <h3 class="section-title">
            <span class="icon-badge">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M3 12h18"/><path d="M12 10v4M10 12h4"/></svg>
            </span>
            Chronic Diseases
          </h3>
          <div class="check-list" id="chronicDiseases">
            <label class="check-item"><input type="checkbox" value="Diabetes"> Diabetes</label>
            <label class="check-item"><input type="checkbox" value="Hypertension" checked> Hypertension</label>
            <label class="check-item"><input type="checkbox" value="Asthma"> Asthma</label>
            <label class="check-item"><input type="checkbox" value="Other"> Other</label>
          </div>
        </div>

        <div>
          <h3 class="section-title warning">
            <span class="icon-badge">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><path d="M12 9v4M12 17h.01M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/></svg>
            </span>
            Allergies
          </h3>
          <textarea class="input" id="allergies" placeholder="List any allergies...">Penicillin, Seafood</textarea>
        </div>
      </div>

      <p class="form-error" id="medicalError"></p>

      <div class="actions">
        <button type="button" class="btn btn-back" onclick="goTo('page-medical')" disabled style="visibility:hidden;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
          Back
        </button>
        <button type="button" class="btn btn-next" id="btnMedicalNext" onclick="submitMedicalProfile()">
          <span class="btn-text">Next</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </button>
      </div>
    </form>
  </section>

  <!-- ============ PAGE 3: CAREGIVER INFO ============ -->
  <section class="page" id="page-caregiver">
    <div class="form-header">
      <h1>Caregiver Information</h1>
      <p>Who should we notify in an emergency?</p>
    </div>

    <div class="alert-card">
      <div class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="22" height="22"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="10" r="2.5"/><path d="M5 19c1-2.5 3-4 4-4s3 1.5 4 4"/><path d="m14 8 2 2 4-4"/></svg>
      </div>
      <div>
        <h3>Emergency Contact</h3>
        <p>This person will be alerted immediately if you trigger an emergency SOS.</p>
      </div>
    </div>

    <form onsubmit="return false;">
      <div class="caregiver-grid">
        <div class="field">
          <div class="input-icon-wrap">
            <span class="icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-7 8-7s8 3 8 7"/></svg>
            </span>
            <input class="input" type="text" id="caregiverName" placeholder="Full name" value="Ahmed Mohammed">
          </div>
        </div>
        <div class="field">
          <div class="select-wrap">
            <select class="input" id="caregiverRelationship">
              <option>Brother</option>
              <option>Sister</option>
              <option>Parent</option>
              <option>Spouse</option>
              <option>Friend</option>
            </select>
          </div>
        </div>
        <div class="field">
          <div class="input-icon-wrap">
            <span class="icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.68 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.32 1.85.55 2.81.68A2 2 0 0 1 22 16.92z"/></svg>
            </span>
            <input class="input" type="tel" id="caregiverPhone" placeholder="Phone number" value="01012345678">
          </div>
        </div>
        <div class="field">
          <div class="input-icon-wrap">
            <span class="icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 7 10 6 10-6"/></svg>
            </span>
            <input class="input" type="email" id="caregiverEmail" placeholder="Email address" value="ahmed@example.com">
          </div>
        </div>
      </div>

      <p class="form-error" id="caregiverError"></p>

      <div class="actions">
        <button type="button" class="btn btn-back" onclick="goTo('page-medical')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
          Back
        </button>
        <button type="button" class="btn btn-finish" id="btnFinish" onclick="submitCaregiver()">
          <span class="btn-text">Finish Setup</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m5 12 5 5L20 7"/><path d="m2 12 5 5"/></svg>
        </button>
      </div>
    </form>
  </section>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/js/config/supabase.js"></script>
<script src="../assets//js/pages/medical-setup.js"></script>

</body>
</html>
